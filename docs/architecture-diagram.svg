<svg style="background:#0d1014" viewBox="0 0 1320 1190" role="img" aria-label="Kacy architecture: an employee prompt flows through guardrails into the Kacy agent, which is scoped by an Entra ID identity and RBAC check, then branches into a RAG knowledge lane, a cost-routing lane with semantic cache and model router, and a tools lane gated by human approval for write actions, with every layer feeding tool-call traces and prompt logs into an evaluation suite and release gate.">
  <style>
text{font-family:Inter,system-ui,sans-serif;fill:#e7ebf0}
.t-title{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;font-weight:600}
.t-sub{font-size:10px;fill:#8a94a3}
.lbl{font-size:9.5px;fill:#8a94a3}
.lbl-bg{fill:#0d1014}
.box{fill:#161b21;stroke:#2b323b;stroke-width:1.2}
.box-core{fill:#1a2440;stroke:#6c93ff;stroke-width:1.6}
.box-core text.t-title{fill:#6c93ff}
.box-guard{fill:#3a2b14;stroke:#e0a356;stroke-width:1.4}
.box-guard text.t-title{fill:#e0a356}
.box-good{fill:#102a1c;stroke:#52c285;stroke-width:1.6}
.box-good text.t-title{fill:#52c285}
.group{fill:none;stroke:#2b323b;stroke-width:1;stroke-dasharray:4 3}
.group-label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.06em;fill:#8a94a3}
line,path.arrow{stroke:#8a94a3;stroke-width:1.3;fill:none}
.arrow-accent{stroke:#6c93ff}
</style><defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- ===== Row 1: entry ===== -->
  <rect class="box" x="40" y="40" width="160" height="56" rx="8"/>
  <text class="t-title" x="120" y="64" text-anchor="middle">Employee</text>
  <text class="t-sub" x="120" y="80" text-anchor="middle">signed-in user</text>

  <rect class="box" x="260" y="40" width="320" height="56" rx="8"/>
  <text class="t-title" x="420" y="62" text-anchor="middle">Kacy — Copilot UI</text>
  <text class="t-sub" x="420" y="78" text-anchor="middle">chat pane + live activity / approval pane</text>

  <!-- ===== Row 2: input guardrails ===== -->
  <rect class="box box-guard" x="260" y="140" width="220" height="56" rx="8"/>
  <text class="t-title" x="370" y="164" text-anchor="middle">Input Classifier</text>
  <text class="t-sub" x="370" y="180" text-anchor="middle">scores intent</text>

  <rect class="box box-guard" x="520" y="140" width="280" height="56" rx="8"/>
  <text class="t-title" x="660" y="164" text-anchor="middle">Jailbreak + Injection Shield</text>
  <text class="t-sub" x="660" y="180" text-anchor="middle">direct + indirect prompt injection</text>

  <!-- ===== Row 3: identity / agent / rbac ===== -->
  <rect class="box box-guard" x="40" y="236" width="260" height="84" rx="8"/>
  <text class="t-title" x="170" y="264" text-anchor="middle">Agent Identity</text>
  <text class="t-sub" x="170" y="280" text-anchor="middle">Entra ID service principal —</text>
  <text class="t-sub" x="170" y="294" text-anchor="middle">zero permissions by default</text>

  <rect class="box box-core" x="360" y="226" width="400" height="104" rx="10"/>
  <text class="t-title" x="560" y="262" text-anchor="middle" font-size="15">KACY AGENT</text>
  <text class="t-sub" x="560" y="282" text-anchor="middle">system prompt — name · persona · tone</text>
  <text class="t-sub" x="560" y="298" text-anchor="middle">decides: answer, retrieve, or call a tool</text>

  <rect class="box box-guard" x="820" y="236" width="260" height="84" rx="8"/>
  <text class="t-title" x="950" y="264" text-anchor="middle">RBAC / OBO Check</text>
  <text class="t-sub" x="950" y="280" text-anchor="middle">on-behalf-of signed-in user —</text>
  <text class="t-sub" x="950" y="294" text-anchor="middle">intern / manager / exec scope</text>

  <!-- ===== Lane A: knowledge (RAG) ===== -->
  <text class="group-label" x="40" y="352">Knowledge — RAG</text>
  <rect class="box" x="40" y="360" width="340" height="50" rx="8"/>
  <text class="t-title" x="210" y="381" text-anchor="middle">Company Docs</text>
  <text class="t-sub" x="210" y="396" text-anchor="middle">handbook · policies · org chart</text>

  <rect class="box" x="40" y="440" width="340" height="50" rx="8"/>
  <text class="t-title" x="210" y="461" text-anchor="middle">Embeddings</text>
  <text class="t-sub" x="210" y="476" text-anchor="middle">text-embedding-3-small</text>

  <rect class="box" x="40" y="520" width="340" height="68" rx="8"/>
  <text class="t-title" x="210" y="548" text-anchor="middle">Azure AI Search</text>
  <text class="t-sub" x="210" y="564" text-anchor="middle">vector index</text>

  <!-- ===== Lane B: cost + routing ===== -->
  <text class="group-label" x="440" y="352">Cost control</text>
  <rect class="box" x="440" y="360" width="360" height="50" rx="8"/>
  <text class="t-title" x="620" y="381" text-anchor="middle">Semantic Cache</text>
  <text class="t-sub" x="620" y="396" text-anchor="middle">catches repeat queries, e.g. daily "Hi"</text>

  <rect class="box" x="440" y="440" width="360" height="50" rx="8"/>
  <text class="t-title" x="620" y="461" text-anchor="middle">Model Router</text>
  <text class="t-sub" x="620" y="476" text-anchor="middle">cost / quality / balanced modes</text>

  <rect class="box" x="440" y="520" width="170" height="68" rx="8"/>
  <text class="t-title" x="525" y="548" text-anchor="middle">Small model</text>
  <text class="t-sub" x="525" y="564" text-anchor="middle">simple queries</text>

  <rect class="box" x="630" y="520" width="170" height="68" rx="8"/>
  <text class="t-title" x="715" y="548" text-anchor="middle">Large model</text>
  <text class="t-sub" x="715" y="564" text-anchor="middle">complex queries</text>

  <!-- ===== Lane C: tools via MCP ===== -->
  <text class="group-label" x="860" y="352">Action — tool calling (MCP)</text>
  <rect class="box" x="860" y="360" width="420" height="50" rx="8"/>
  <text class="t-title" x="1070" y="381" text-anchor="middle">MCP Gateway</text>
  <text class="t-sub" x="1070" y="396" text-anchor="middle">function calling → MCP tool servers</text>

  <rect class="group" x="860" y="428" width="420" height="96" rx="8"/>
  <text class="group-label" x="876" y="422">Read-only lookups</text>
  <rect class="box" x="880" y="452" width="170" height="58" rx="7"/>
  <text class="t-title" x="965" y="476" text-anchor="middle">HR Tool</text>
  <text class="t-sub" x="965" y="491" text-anchor="middle">leave, salary</text>

  <rect class="box" x="1090" y="452" width="170" height="58" rx="7"/>
  <text class="t-title" x="1175" y="476" text-anchor="middle">Docs</text>
  <text class="t-sub" x="1175" y="491" text-anchor="middle">draft / summarize</text>

  <rect class="group" x="860" y="542" width="420" height="180" rx="8"/>
  <text class="group-label" x="876" y="536">Write actions — behind approval</text>
  <rect class="box box-guard" x="880" y="558" width="380" height="36" rx="6"/>
  <text class="t-title" x="1070" y="581" text-anchor="middle" font-size="11">Approval Gate — Approve / Edit / Discard</text>

  <rect class="box" x="880" y="608" width="170" height="54" rx="7"/>
  <text class="t-title" x="965" y="630" text-anchor="middle" font-size="11">IT Ticket</text>
  <text class="t-sub" x="965" y="645" text-anchor="middle">Jira-style</text>

  <rect class="box" x="1090" y="608" width="170" height="54" rx="7"/>
  <text class="t-title" x="1175" y="630" text-anchor="middle" font-size="11">Email</text>
  <text class="t-sub" x="1175" y="645" text-anchor="middle">draft + send</text>

  <rect class="box" x="880" y="676" width="170" height="38" rx="7"/>
  <text class="t-title" x="965" y="699" text-anchor="middle" font-size="11">Calendar</text>

  <rect class="box" x="1090" y="676" width="170" height="38" rx="7"/>
  <text class="t-title" x="1175" y="699" text-anchor="middle" font-size="11">Approval Chain</text>

  <rect class="box box-guard" x="860" y="742" width="420" height="54" rx="8"/>
  <text class="t-title" x="1070" y="764" text-anchor="middle">PII Redaction</text>
  <text class="t-sub" x="1070" y="780" text-anchor="middle">strips sensitive fields before the result returns</text>

  <!-- ===== Observability spine ===== -->
  <rect class="box" x="260" y="880" width="800" height="54" rx="8"/>
  <text class="t-title" x="660" y="902" text-anchor="middle">Tool-call Traces + Prompt Logs</text>
  <text class="t-sub" x="660" y="918" text-anchor="middle">every step instrumented</text>

  <rect class="box" x="340" y="968" width="640" height="54" rx="8"/>
  <text class="t-title" x="660" y="990" text-anchor="middle">Evaluation Suite</text>
  <text class="t-sub" x="660" y="1006" text-anchor="middle">groundedness · safety · identity consistency</text>

  <rect class="box box-good" x="410" y="1056" width="500" height="70" rx="10"/>
  <text class="t-title" x="660" y="1086" text-anchor="middle" font-size="14">Release Gate</text>
  <text class="t-sub" x="660" y="1104" text-anchor="middle">passed → deploy · blocked → fix · catches identity regression after a prompt change</text>

  <!-- ===== Arrows ===== -->
  <!-- entry -->
  <line x1="200" y1="68" x2="258" y2="68" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="204" y="58" width="50" height="14"/><text class="lbl" x="229" y="68" text-anchor="middle">prompts</text>

  <line x1="400" y1="96" x2="378" y2="138" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="355" y="110" width="58" height="14"/><text class="lbl" x="384" y="120" text-anchor="middle">request</text>

  <line x1="480" y1="168" x2="518" y2="168" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="412" y="150" width="140" height="14"/><text class="lbl" x="482" y="160" text-anchor="middle">incl. injection attempts</text>

  <line x1="660" y1="196" x2="580" y2="224" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="565" y="205" width="78" height="14"/><text class="lbl" x="604" y="215" text-anchor="middle">clean input</text>

  <line x1="300" y1="278" x2="358" y2="278" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="304" y="268" width="52" height="14"/><text class="lbl" x="330" y="278" text-anchor="middle">scopes</text>

  <line x1="760" y1="278" x2="818" y2="278" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="764" y="268" width="78" height="14"/><text class="lbl" x="803" y="278" text-anchor="middle">authorize</text>

  <!-- agent to lane A -->
  <line x1="460" y1="330" x2="220" y2="358" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="300" y="336" width="90" height="14"/><text class="lbl" x="345" y="346" text-anchor="middle">query (RAG)</text>

  <line x1="210" y1="410" x2="210" y2="438" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="214" y="418" width="70" height="12"/><text class="lbl" x="249" y="427" text-anchor="middle">chunk + embed</text>

  <line x1="210" y1="490" x2="210" y2="518" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="214" y="498" width="34" height="12"/><text class="lbl" x="231" y="507" text-anchor="middle">index</text>

  <line x1="300" y1="520" x2="600" y2="332" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="380" y="430" width="100" height="14"/><text class="lbl" x="430" y="440" text-anchor="middle">grounded chunks</text>

  <!-- agent to lane B -->
  <line x1="620" y1="330" x2="620" y2="358" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="624" y="338" width="70" height="12"/><text class="lbl" x="659" y="347" text-anchor="middle">model call</text>

  <path class="arrow" d="M800,395 C 860,360 860,290 762,284" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="800" y="330" width="130" height="14"/><text class="lbl" x="865" y="340" text-anchor="middle">cache hit — skip model</text>

  <line x1="620" y1="410" x2="620" y2="438" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="624" y="418" width="30" height="12"/><text class="lbl" x="639" y="427" text-anchor="middle">miss</text>

  <line x1="560" y1="490" x2="530" y2="518" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="488" y="498" width="48" height="12"/><text class="lbl" x="512" y="507" text-anchor="middle">simple</text>

  <line x1="680" y1="490" x2="710" y2="518" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="686" y="498" width="54" height="12"/><text class="lbl" x="713" y="507" text-anchor="middle">complex</text>

  <!-- agent to lane C -->
  <line x1="760" y1="320" x2="1050" y2="358" marker-end="url(#arrow-accent)" class="arrow-accent"/>
  <rect class="lbl-bg" x="840" y="330" width="150" height="14"/><text class="lbl" x="915" y="340" text-anchor="middle">tool call (function calling)</text>

  <line x1="1000" y1="410" x2="1000" y2="426" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="938" y="412" width="44" height="12"/><text class="lbl" x="960" y="421" text-anchor="middle">lookup</text>

  <line x1="1130" y1="410" x2="1130" y2="540" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="1134" y="470" width="90" height="12"/><text class="lbl" x="1179" y="479" text-anchor="middle">action request</text>

  <line x1="965" y1="510" x2="1015" y2="740" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="970" y="600" width="130" height="24"/>
  <text class="lbl" x="1035" y="610" text-anchor="middle">sensitive field found</text>
  <text class="lbl" x="1035" y="621" text-anchor="middle">(e.g. salary)</text>

  <path class="arrow" d="M900,742 C 760,700 700,420 756,296" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="706" y="500" width="90" height="14"/><text class="lbl" x="751" y="510" text-anchor="middle">redacted result</text>

  <path class="arrow" d="M1070,558 C 950,520 850,400 762,284" marker-end="url(#arrow)"/>
  <rect class="lbl-bg" x="860" y="440" width="70" height="12"/><text class="lbl" x="895" y="449" text-anchor="middle">result</text>

  <!-- observability spine -->
  <line x1="560" y1="330" x2="640" y2="878" marker-end="url(#arrow)" stroke-dasharray="3 3"/>
  <rect class="lbl-bg" x="560" y="590" width="150" height="14"/><text class="lbl" x="635" y="600" text-anchor="middle">instrument every step</text>

  <line x1="660" y1="934" x2="660" y2="966" marker-end="url(#arrow)"/>
  <line x1="660" y1="1022" x2="660" y2="1054" marker-end="url(#arrow)"/>
</svg>